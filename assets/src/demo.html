<!doctype html>
<!-- Demo animation: two sheets of paper captured in one go. `apply(t)` draws the
     frame for time t; assets/render.mjs calls it frame by frame for assets/demo.gif.
     Open this file in a browser to watch it play. -->
<html>
<head>
<meta charset="utf-8">
<title>herdr-cam demo</title>
<link rel="stylesheet" href="scene.css">
<style>
  #stage { position: relative; width: 960px; height: 600px; background: var(--crust); }
  .chip-img { background: rgba(137, 180, 250, 0.14); border-radius: 3px; padding: 0 2px; }
  .ok { color: var(--green); }
  .warn { color: var(--peach); }
</style>
</head>
<body>
<div id="stage"></div>
<script src="scene.js"></script>
<script>
const DURATION = 17;
const stage = document.getElementById("stage");
const term = terminal({ x: 20, y: 20, w: 920, h: 560 });
const cam = camera({ x: 360, y: 60, w: 540 });
const k1 = keys(["ctrl", "b", "then", "i"], { x: 380, y: 452 });
const k2 = keys(["Space"], { x: 448, y: 452 });
const k3 = keys(["Space"], { x: 448, y: 452 });
const k4 = keys(["⏎ Enter", "send photos"], { x: 400, y: 452 });
const k5 = keys(["⏎ Enter", "send prompt"], { x: 400, y: 452 });
k4.lastChild.className = "then"; k5.lastChild.className = "then";
stage.append(term, cam, k1, k2, k3, k4, k5);

const transcript = term.querySelector(".transcript");
const input = term.querySelector(".input");
const cursor = term.querySelector(".cursor");
const [page1, page2] = cam.querySelectorAll(".page");
const [thumb1, thumb2] = cam.querySelectorAll(".thumb");
const hudEl = cam.querySelector(".hud");
const flash = cam.querySelector(".flash");

const INTRO = `
  <div class="bullet">Auth API is in: POST /api/session returns a token, and requests are rate limited.</div>
  <div class="dim">&nbsp;&nbsp;Next is the login screen. Sketch it on paper if that's quicker.</div>`;
const TYPED = "build this login card, and check my rate limiter dry run ";
const IMGS = `<span class="chip-img">[Image #1]</span> <span class="chip-img">[Image #2]</span>`;
const ASK = `<div class="user" style="margin-top:14px">&gt; ${TYPED}${IMGS}</div>`;
const REPLY = [
  `<div class="bullet" style="margin-top:10px">Two things from your photos:</div>`,
  `<div>&nbsp;&nbsp;1. Login card: logo, "Welcome back", email, password, remember me, a full-width</div>`,
  `<div>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Sign in button, and your red note: 8px corners.</div>`,
  `<div>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="ok">Wrote src/components/LoginCard.tsx</span></div>`,
  `<div style="margin-top:6px">&nbsp;&nbsp;2. Rate limiter: the trace slips at <span class="warn">t=3</span>. The bucket is empty after t=2 and</div>`,
  `<div>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;refills by 1, so it holds 1 token, not 2: only 1 of the 2 requests passes.</div>`,
];

const show = (node, on, fade = 1) => { node.style.opacity = on ? fade : 0; };
const pop = (t, at, len = 0.7) => t >= at && t < at + len;

// One sheet's position: lifted in at `inAt`, held with a small hand wobble, dropped
// out of frame at `outAt`.
function placePage(page, t, inAt, outAt, seed) {
  const lift = ease((t - inAt) / 0.8);
  const drop = outAt ? ease((t - outAt) / 0.6) : 0;
  const wob = Math.sin(t * 2.6 + seed) * 1.2;
  page.style.width = "300px";
  page.style.left = `${120 + wob * 2}px`;
  page.style.top = `${22 + (1 - lift) * 300 + drop * 320 + Math.cos(t * 2.1 + seed) * 2}px`;
  page.style.transform = `rotate(${-2.5 + seed + wob * 0.6}deg)`;
  page.style.opacity = t >= inAt && (!outAt || t < outAt + 0.6) ? 1 : 0;
}

function apply(t) {
  const typed = Math.floor(clamp((t - 0.3) / 1.7) * TYPED.length);
  const pasted = t >= 9.7;
  const sent = t >= 10.9;

  transcript.innerHTML = INTRO + (sent ? ASK : "");
  if (sent) {
    const lines = t >= 11.2 ? Math.min(REPLY.length, 1 + Math.floor((t - 11.2) / 0.35)) : 0;
    transcript.innerHTML += REPLY.slice(0, lines).join("");
  }
  input.innerHTML = sent ? "" : TYPED.slice(0, typed) + (pasted ? IMGS : "");
  cursor.style.opacity = Math.floor(t * 2) % 2 === 0 || t < 2.2 ? 1 : 0.15;

  // keycaps
  show(k1, pop(t, 2.1, 0.9), ease((t - 2.1) / 0.15));
  show(k2, pop(t, 4.6), ease((t - 4.6) / 0.15));
  show(k3, pop(t, 7.9), ease((t - 7.9) / 0.15));
  show(k4, pop(t, 9.0), ease((t - 9.0) / 0.15));
  show(k5, pop(t, 10.3, 0.6), ease((t - 10.3) / 0.15));

  // camera window: in at 2.5, out at 9.3
  const camVis = t >= 2.5 && t < 9.5 ? ease((t - 2.5) / 0.25) * (1 - ease((t - 9.3) / 0.2)) : 0;
  cam.style.opacity = camVis;
  cam.style.transform = `scale(${0.96 + 0.04 * camVis})`;

  placePage(page1, t, 2.7, 5.4, 0);
  placePage(page2, t, 6.0, null, 0.8);

  // shutter flashes, then the photo drops into the tray and the HUD counts it
  flash.style.opacity = pop(t, 4.8, 0.3) ? 0.85 * (1 - (t - 4.8) / 0.3)
    : pop(t, 8.1, 0.3) ? 0.85 * (1 - (t - 8.1) / 0.3) : 0;
  show(thumb1, t >= 5.0, ease((t - 5.0) / 0.2));
  show(thumb2, t >= 8.3, ease((t - 8.3) / 0.2));
  hudEl.textContent = hud(t >= 8.3 ? 2 : t >= 5.0 ? 1 : 0);
}

const m = location.hash.match(/t=([\d.]+)/);
if (m) {
  apply(parseFloat(m[1]));
} else if (!location.hash.includes("still")) {
  const start = performance.now();
  (function loop() {
    apply(((performance.now() - start) / 1000) % DURATION);
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
